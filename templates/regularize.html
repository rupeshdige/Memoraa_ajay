{% extends "base.html" %}
{% block title %}Regularize - Memoraa{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Attendance Regularization</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date *</label>
                        <input type="date" name="date" class="form-control" max="{{ today }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Requested Punch In</label>
                            <input type="time" name="punch_in" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Requested Punch Out</label>
                            <input type="time" name="punch_out" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reason *</label>
                        <textarea name="reason" class="form-control" rows="3" 
                                  placeholder="Explain why you need regularization..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-gold">
                        <i class="bi bi-send"></i> Submit Request
                    </button>
                    <a href="{{ url_for('my_requests') }}" class="btn btn-outline-secondary">
                        View My Requests
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
