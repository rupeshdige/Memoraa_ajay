{% extends "base.html" %}
{% block title %}Login - Memoraa{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color:#1a1a1a;">MEMORAA</h2>
                    <p class="text-muted small">Photography Studio • Attendance System</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="text" name="mobile" class="form-control form-control-lg" 
                               placeholder="Enter mobile number" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" 
                               placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-gold w-100 btn-lg">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center text-muted small mt-3">© Memoraa Photography Studio</p>
    </div>
</div>
{% endblock %}
