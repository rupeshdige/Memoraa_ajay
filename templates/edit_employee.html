{% extends "base.html" %}
{% block title %}Edit Employee - Memoraa{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Employee — {{ user.emp_id }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select">
                                <option value="employee" {% if user.role == 'employee' %}selected{% endif %}>Employee</option>
                                <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>Manager</option>
                                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Manager</label>
                            <select name="manager_id" class="form-select">
                                <option value="">— None —</option>
                                {% for m in managers %}
                                <option value="{{ m.id }}" {% if user.manager_id == m.id %}selected{% endif %}>
                                    {{ m.name }} ({{ m.emp_id }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Monthly Salary (₹)</label>
                            <input type="number" name="monthly_salary" class="form-control" step="0.01" 
                                   value="{{ user.monthly_salary or 0 }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password (leave blank to keep current)</label>
                        <input type="password" name="password" class="form-control">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                               {% if user.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                    <button type="submit" class="btn btn-gold">Update Employee</button>
                    <a href="{{ url_for('employees') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
